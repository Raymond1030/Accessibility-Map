name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同时只跑一个部署，但不取消进行中的那个——避免半路中断留下坏状态
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 测试不过就不部署
      - run: npm test

      - run: npm run build
        env:
          VITE_BASE: /Accessibility-Map/
          VITE_AMAP_KEY: ${{ secrets.VITE_AMAP_KEY }}
          VITE_AMAP_SECURITY_CODE: ${{ secrets.VITE_AMAP_SECURITY_CODE }}
          VITE_MAPBOX_TOKEN: ${{ secrets.VITE_MAPBOX_TOKEN }}

      # public/ 下的文件不经 Vite 处理，用不了 import.meta.env，
      # 所以在产物里替换占位符。token 留在源码里会被 GitHub 推送保护拦截。
      - name: Inject token into standalone pages
        run: |
          sed -i "s|__MAPBOX_TOKEN__|${{ secrets.VITE_MAPBOX_TOKEN }}|g" dist/mapbox-speed.html
          grep -q "__MAPBOX_TOKEN__" dist/mapbox-speed.html && exit 1 || echo "token injected"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
