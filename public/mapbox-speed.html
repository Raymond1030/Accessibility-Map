<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mapbox 国内速度实测</title>
<link href="https://api.mapbox.com/mapbox-gl-js/v3.9.0/mapbox-gl.css" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font: 14px/1.6 system-ui, -apple-system, "PingFang SC", sans-serif; }
  #map { position: absolute; inset: 0; }
  #panel {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 10;
    background: rgba(255,255,255,.96); border-top: 1px solid #ddd;
    padding: 12px 14px calc(12px + env(safe-area-inset-bottom));
    box-shadow: 0 -2px 12px rgba(0,0,0,.12);
  }
  h1 { font-size: 14px; margin: 0 0 8px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  td { padding: 3px 0; }
  td:last-child { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
  .verdict { margin-top: 8px; padding: 8px 10px; border-radius: 6px; font-size: 13px; }
  .good { background: #ecfdf5; color: #065f46; }
  .ok   { background: #fffbeb; color: #92400e; }
  .bad  { background: #fef2f2; color: #991b1b; }
  .hint { color: #6b7280; font-size: 12px; margin-top: 6px; }
</style>
</head>
<body>
<div id="map"></div>
<div id="panel">
  <h1>Mapbox 国内速度实测 · 深圳</h1>
  <table>
    <tr><td>底图首屏可用</td><td id="t-load">测量中…</td></tr>
    <tr><td>瓦片请求数</td><td id="t-count">—</td></tr>
    <tr><td>单张瓦片最慢</td><td id="t-slowest">—</td></tr>
    <tr><td>下载总量</td><td id="t-bytes">—</td></tr>
    <tr><td>Isochrone API</td><td id="t-api">待测</td></tr>
  </table>
  <div id="verdict" class="verdict ok">正在加载底图，请等它完全显示…</div>
  <div class="hint">拖动地图几下再看数字——平移缩放会持续拉新瓦片，那才是真实使用感受。</div>
</div>

<script src="https://api.mapbox.com/mapbox-gl-js/v3.9.0/mapbox-gl.js"></script>
<script>
// 占位符由 CI 在构建后替换。token 绝不能进源码——
// GitHub 的推送保护会直接拦下带 Mapbox token 的提交。
const TOKEN = '__MAPBOX_TOKEN__';
mapboxgl.accessToken = TOKEN;

const t0 = performance.now();
const map = new mapboxgl.Map({
  container: 'map',
  style: 'mapbox://styles/mapbox/streets-v12',
  center: [113.9435, 22.5333],
  zoom: 12,
});

function mapboxResources() {
  return performance.getEntriesByType('resource').filter(r => r.name.includes('api.mapbox.com'));
}

function refresh() {
  const rs = mapboxResources();
  const bytes = rs.reduce((s, r) => s + (r.transferSize || 0), 0);
  const slowest = rs.reduce((m, r) => Math.max(m, r.duration), 0);
  document.getElementById('t-count').textContent = rs.length + ' 个请求';
  document.getElementById('t-slowest').textContent = Math.round(slowest) + ' ms';
  document.getElementById('t-bytes').textContent = (bytes / 1024).toFixed(0) + ' KB';
}

map.on('load', () => {
  const ms = Math.round(performance.now() - t0);
  document.getElementById('t-load').textContent = ms + ' ms';
  refresh();

  const v = document.getElementById('verdict');
  if (ms < 2000) {
    v.className = 'verdict good';
    v.textContent = '底图 ' + ms + ' ms 可用 —— 这个速度换 Mapbox 底图没问题。';
  } else if (ms < 5000) {
    v.className = 'verdict ok';
    v.textContent = '底图 ' + ms + ' ms 可用 —— 偏慢但能用，每次平移缩放都会有明显等待。';
  } else {
    v.className = 'verdict bad';
    v.textContent = '底图 ' + ms + ' ms 才可用 —— 这个速度下换 Mapbox 底图，日常用会很难受。';
  }
});

map.on('error', (e) => {
  const v = document.getElementById('verdict');
  v.className = 'verdict bad';
  v.textContent = '底图加载出错：' + (e.error && e.error.message ? e.error.message : '未知错误');
});

map.on('idle', refresh);

// 顺带测一次 Isochrone API
const ta = performance.now();
fetch('https://api.mapbox.com/isochrone/v1/mapbox/driving/113.9435,22.5333?contours_minutes=15&polygons=true&access_token=' + TOKEN)
  .then(r => r.json())
  .then(() => {
    document.getElementById('t-api').textContent = Math.round(performance.now() - ta) + ' ms';
  })
  .catch(() => {
    document.getElementById('t-api').textContent = '失败';
  });
</script>
</body>
</html>
